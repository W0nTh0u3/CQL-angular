<section class="contact" aria-labelledby="contact-title">
  <div>
    <p class="eyebrow">Contact | Manila</p>
    <h1 id="contact-title">Let’s map<br />what’s <em>next.</em></h1>
    <p class="lead">We would like to hear from you.</p>
  </div>
  <address>
    <div class="contact-block">
      <p class="label">Office</p>
      @for (line of contact.address; track line) {
        <p>{{ line }}</p>
      }
    </div>
    <div class="contact-block">
      <p class="label">Telephone</p>
      <a class="contact-value" [href]="contact.phoneHref">{{
        contact.phone
      }}</a>
    </div>
    <div class="contact-block">
      <p class="label">Fax</p>
      <p class="contact-value">{{ contact.fax }}</p>
    </div>
    <div class="contact-block">
      <p class="label">Email</p>
      <a class="contact-value" [href]="'mailto:' + contact.email">{{
        contact.email
      }}</a>
    </div>
  </address>
</section>
